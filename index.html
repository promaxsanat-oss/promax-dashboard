<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRO MAX — Все магазины</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0b1020;
  --card: rgba(255,255,255,0.045);
  --card-border: rgba(255,255,255,0.09);
  --text: #e7eaf3;
  --muted: #8b93a9;
  --accent: #8b5cf6;
  --accent2: #3b82f6;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  min-height: 100dvh;
  padding: 16px;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(139,92,246,0.22), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(59,130,246,0.16), transparent 60%),
    var(--bg);
  -webkit-tap-highlight-color: transparent;
}
.hidden { display: none !important; }

/* ---------- Header ---------- */
.app-header { text-align: center; margin: 8px 0 20px; }
.app-header .logo {
  font-size: 26px; font-weight: 800; letter-spacing: 0.5px;
  background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.app-header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* ---------- Login ---------- */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 70dvh; }
.login-box {
  width: 100%; max-width: 340px; padding: 28px 24px;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 24px; backdrop-filter: blur(14px);
  box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  animation: pop .35s ease;
}
.login-box .avatar {
  width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px;
  background: linear-gradient(135deg, #8b5cf6, #3b82f6);
  display: flex; align-items: center; justify-content: center; font-size: 30px;
  box-shadow: 0 10px 30px rgba(139,92,246,0.45);
}
.login-box h2 { text-align: center; font-size: 18px; margin-bottom: 18px; }
.field { position: relative; margin-bottom: 12px; }
.field input {
  width: 100%; padding: 13px 14px 13px 42px; font-size: 16px; color: var(--text);
  background: rgba(0,0,0,0.25); border: 1px solid var(--card-border);
  border-radius: 14px; outline: none; transition: border .15s, box-shadow .15s;
  -webkit-appearance: none;
}
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.25); }
.field .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: .7; }
.btn {
  width: 100%; padding: 13px; border: none; border-radius: 14px; cursor: pointer;
  font-size: 16px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  box-shadow: 0 10px 24px rgba(139,92,246,0.35);
  transition: transform .12s, box-shadow .12s, filter .12s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.98); }
.login-err { color: #fca5a5; font-size: 13px; text-align: center; min-height: 18px; margin-top: 10px; }

/* ---------- Home ---------- */
.net-summary {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  max-width: 900px; margin: 0 auto 16px;
}
.net-card {
  background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
  padding: 14px 10px; text-align: center; backdrop-filter: blur(10px);
}
.net-card .v { font-size: 17px; font-weight: 800; }
.net-card .l { font-size: 11px; color: var(--muted); margin-top: 3px; }
.store-grid { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 900px; margin: 0 auto; }
@media(min-width: 640px) { .store-grid { grid-template-columns: repeat(3, 1fr); } }
.store-card {
  position: relative; overflow: hidden; cursor: pointer; text-align: left;
  border-radius: 22px; padding: 20px 18px; color: #fff; border: 1px solid rgba(255,255,255,0.14);
  transition: transform .18s, box-shadow .18s;
  animation: pop .35s ease backwards;
}
.store-card:nth-child(1) { background: linear-gradient(140deg, #6d28d9, #4f46e5); }
.store-card:nth-child(2) { background: linear-gradient(140deg, #0369a1, #2563eb); }
.store-card:nth-child(3) { background: linear-gradient(140deg, #0f766e, #059669); }
.store-card:hover { transform: translateY(-4px); box-shadow: 0 22px 44px rgba(0,0,0,0.45); }
.store-card::after {
  content: ''; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px;
  border-radius: 50%; background: rgba(255,255,255,0.12);
}
.store-card .sname { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.store-card .sstats { font-size: 13px; opacity: .92; margin-top: 10px; line-height: 1.65; }
.store-card .sfresh { font-size: 11px; opacity: .75; margin-top: 6px; }
.store-card .upload-btn {
  display: inline-block; margin-top: 12px; padding: 7px 14px; font-size: 12px; cursor: pointer;
  background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.28); border-radius: 10px;
}
.store-card input[type="file"] { display: none; }
#homeStatus { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; min-height: 18px; }

/* ---------- Store page ---------- */
.page { max-width: 900px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.back-btn {
  background: var(--card); border: 1px solid var(--card-border); color: var(--text);
  padding: 9px 14px; border-radius: 12px; cursor: pointer; font-size: 14px;
}
.back-btn:hover { border-color: var(--accent); }
.store-title { font-size: 20px; font-weight: 800; flex: 1; }
.sync-pill { font-size: 11px; color: var(--muted); background: var(--card); border: 1px solid var(--card-border); padding: 6px 10px; border-radius: 999px; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--muted); background: var(--card); border: 1px solid var(--card-border);
  border-radius: 999px; white-space: nowrap; transition: all .15s;
}
.tab.active { color: #fff; background: linear-gradient(135deg, #8b5cf6, #6366f1); border-color: transparent; box-shadow: 0 6px 16px rgba(139,92,246,0.35); }

.controls { display: flex; gap: 10px; margin-bottom: 14px; }
.search-box {
  flex: 1; padding: 12px 14px; font-size: 15px; color: var(--text);
  background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; outline: none;
  -webkit-appearance: none;
}
.search-box:focus { border-color: var(--accent); }
.icon-btn {
  padding: 0 16px; border-radius: 14px; border: 1px solid var(--card-border);
  background: var(--card); color: var(--text); font-size: 17px; cursor: pointer;
}
.icon-btn:active { transform: scale(0.95); }

/* ---------- Lists ---------- */
.card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 12px;
  backdrop-filter: blur(10px);
}
.card-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 16px; font-weight: 700; font-size: 14px;
  border-bottom: 1px solid var(--card-border); background: rgba(255,255,255,0.03);
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap; }
.row:last-child { border-bottom: none; }
.row .nm { font-size: 14px; font-weight: 600; }
.row .sub2 { font-size: 11px; color: var(--muted); margin-top: 3px; }
.badge { padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; white-space: nowrap; }
.b-green { background: rgba(34,197,94,0.14); color: #4ade80; border: 1px solid rgba(34,197,94,0.35); }
.b-red { background: rgba(239,68,68,0.14); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
.b-amber { background: rgba(245,158,11,0.14); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
.b-blue { background: rgba(59,130,246,0.14); color: #60a5fa; border: 1px solid rgba(59,130,246,0.35); }
.b-violet { background: rgba(139,92,246,0.16); color: #a78bfa; border: 1px solid rgba(139,92,246,0.4); }
.meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.comment { margin-top: 7px; padding: 7px 11px; font-size: 12px; border-radius: 10px; color: #c4b5fd; background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.28); }

.total-banner {
  text-align: center; padding: 14px; margin-bottom: 12px; border-radius: var(--radius);
  font-weight: 800; font-size: 16px;
}

/* ---------- Report ---------- */
.report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.report-card { padding: 18px 12px; border-radius: var(--radius); text-align: center; background: var(--card); border: 1px solid var(--card-border); }
.report-card .icon { font-size: 24px; margin-bottom: 6px; }
.report-card .label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.report-card .value { font-size: 17px; font-weight: 800; }
.chart-box { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.chart-box .ct { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
.net-profit { text-align: center; padding: 20px; border-radius: var(--radius); margin: 14px 0; }

/* ---------- States ---------- */
.empty, .error-box { text-align: center; padding: 40px 20px; color: var(--muted); }
.error-box { color: #f87171; }
.skeleton { padding: 14px 0; }
.sk { height: 54px; border-radius: 14px; margin-bottom: 10px; background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.updated { text-align: center; font-size: 11px; color: var(--muted); margin: 14px 0 4px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
  background: #1c2438; border: 1px solid var(--card-border); color: var(--text);
  padding: 12px 20px; border-radius: 14px; font-size: 14px; z-index: 99;
  opacity: 0; transition: all .3s ease; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">📱 PRO MAX</div>
  <div class="sub">Панель управления сетью магазинов</div>
</div>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-box">
    <div class="avatar">🔐</div>
    <h2>Вход в систему</h2>
    <div class="field"><span class="ic">👤</span><input type="text" id="username" placeholder="Логин" autocomplete="username"></div>
    <div class="field"><span class="ic">🔑</span><input type="password" id="password" placeholder="Пароль" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn" onclick="doLogin()">Войти</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- HOME -->
<div id="home" class="hidden">
  <div class="net-summary" id="netSummary"></div>
  <div id="homeStatus"></div>
  <!-- Поиск по всем магазинам — только для админа -->
  <div id="adminSearchBox" class="hidden page" style="margin-bottom:16px;">
    <input type="text" class="search-box" id="globalSearch" placeholder="🔍 Поиск по всем магазинам: название, IMEI, серийник, штрихкод..." oninput="renderGlobalSearch()">
    <div id="globalResults" style="margin-top:12px;"></div>
  </div>
  <div class="store-grid" id="storeGrid"></div>
  <!-- Аналитика для админа: выручка по дням, ходовые и залежавшиеся товары -->
  <div id="adminAnalytics" style="max-width:900px;margin:16px auto 0;"></div>
</div>

<!-- STORE -->
<div id="storePage" class="hidden page">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">← Магазины</button>
    <div class="store-title" id="storeTitle"></div>
    <div class="sync-pill" id="syncPill"></div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showStoreTab('stock')" id="tab-stock">📦 Остатки</div>
    <div class="tab" onclick="showStoreTab('sales')" id="tab-sales">💰 Продажи</div>
    <div class="tab" onclick="showStoreTab('cash')" id="tab-cash">💵 Касса</div>
    <div class="tab" onclick="showStoreTab('debts')" id="tab-debts">💳 Долги</div>
    <div class="tab" onclick="showStoreTab('expenses')" id="tab-expenses">💸 Расходы</div>
    <div class="tab" onclick="showStoreTab('barters')" id="tab-barters">🔄 Бартеры</div>
    <div class="tab" onclick="showStoreTab('reminders')" id="tab-reminders">🔔 Напоминания</div>
    <div class="tab" onclick="showStoreTab('report')" id="tab-report">📊 Отчёт</div>
    <div class="tab" onclick="showStoreTab('sellers')" id="tab-sellers">🏆 Продавцы</div>
  </div>
  <div class="controls">
    <input type="text" class="search-box" id="storeSearch" placeholder="Поиск..." oninput="renderStoreData()">
    <button class="icon-btn" onclick="refreshCurrent()" title="Обновить данные">🔄</button>
  </div>
  <div id="storeContent"></div>
  <div class="updated" id="storeUpdated"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ================== Конфигурация ================== */
const storeNames = {
  'promax_1': 'PRO MAX — 53',
  'promax_2': 'PRO MAX — 2',
  'promax_markaz': 'PRO MAX — MARKAZ'
};
const storeFiles = { promax_1: 'phone_1.db', promax_2: 'phone_2.db', promax_markaz: 'phone_markaz.db' };

// Пароли хранятся только в виде SHA-256 хэшей (не открытым текстом)
const userHashes = {
  'SANAT':    '8e71b24534e9f3fb3a71263359fed2b7ffb008265e0d34383e319f1b6f5c08f2',
  'SAMIR':    '158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab',
  'JAHONGIR': '5313e5bf17148de844ff74be3663d47c6e361ca469b30a36337701233c89a15e',
  'SHOXRUX':  '8f0f97e140e126a4404a09eb1e14a53b7c742701c4290a5d1702d14daec22ee8',
  'BEXRUZ':   '6ae9e4d22c4670b9140fc378214b3274fb3f64d16058717f974515000680b24c'
};

const AUTO_REFRESH_MS = 120000; // 2 минуты — как у службы синхронизации

let currentUser = null;
let currentStoreId = null;
let currentStoreTab = 'stock';
let SQL = null;
let storeDbs = {};       // storeId -> { db, filename, loadedAt }
let refreshTimer = null;
let chartInstance = null;
let reportOffset = 0;   // 0 = текущий месяц, -1 = прошлый и т.д.
let sellerMonthOffset = 0; // месяц для рейтинга продавцов
const SELLER_BONUS_PCT = 5; // % от прибыли продавцу за месяц

/* ================== Утилиты ================== */
const fmt = n => Math.round(Number(n) || 0).toLocaleString('ru-RU');

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Локальный ключ дня БЕЗ сдвига в UTC (исправление бага часового пояса)
function dayKey(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return 'unknown';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
// Локальная ISO-граница для сравнения строк с датами из базы
function localISO(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function fmtDate(dateStr) {
  const d = new Date(dateStr);
  return isNaN(d) ? '' : d.toLocaleDateString('ru-RU');
}
function fmtTime(dateStr) {
  const d = new Date(dateStr);
  return isNaN(d) ? '' : d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2600);
}
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ================== База ================== */
async function initDb() {
  if (SQL) return;
  SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
}

function execToObjects(db, sql, params) {
  try {
    const stmt = db.prepare(sql);
    if (params) stmt.bind(params);
    const rows = [];
    while (stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
    return rows;
  } catch (e) {
    console.error('SQL error:', sql, e);
    throw new Error('Ошибка чтения данных: ' + e.message);
  }
}
function scalar(db, sql) {
  try {
    const res = execToObjects(db, sql);
    return res.length > 0 ? Object.values(res[0])[0] : 0;
  } catch (e) { return 0; }
}

// Загрузка с обходом кэша (исправление устаревших данных)
async function loadStoreDb(storeId) {
  await initDb();
  const filename = storeFiles[storeId];
  const resp = await fetch(filename + '?t=' + Date.now(), { cache: 'no-store' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const buf = await resp.arrayBuffer();
  const old = storeDbs[storeId];
  storeDbs[storeId] = { db: new SQL.Database(new Uint8Array(buf)), filename, loadedAt: new Date() };
  if (old) try { old.db.close(); } catch (e) {}
}

async function autoLoadAll(silent) {
  const statusEl = document.getElementById('homeStatus');
  if (!silent && statusEl) statusEl.innerHTML = '<span style="color:var(--muted)">⏳ Загрузка баз магазинов…</span>';
  let okCount = 0, failList = [];
  for (const storeId of Object.keys(storeFiles)) {
    try { await loadStoreDb(storeId); okCount++; }
    catch (e) { failList.push(storeNames[storeId]); }
  }
  if (statusEl) {
    if (failList.length === 0) {
      statusEl.innerHTML = '<span style="color:var(--green)">✅ Все базы загружены</span>';
    } else if (okCount > 0) {
      statusEl.innerHTML = '<span style="color:var(--amber)">⚠️ Не загрузились: ' + esc(failList.join(', ')) + '</span>';
    } else {
      statusEl.innerHTML = '<span style="color:var(--red)">❌ Базы не найдены — загрузите вручную кнопкой «📁»</span>';
    }
  }
  renderHome();
}

async function handleFile(storeId, input) {
  const file = input.files[0];
  if (!file) return;
  try {
    await initDb();
    const buf = await file.arrayBuffer();
    const old = storeDbs[storeId];
    storeDbs[storeId] = { db: new SQL.Database(new Uint8Array(buf)), filename: file.name, loadedAt: new Date() };
    if (old) try { old.db.close(); } catch (e) {}
    toast('✅ ' + storeNames[storeId] + ' загружен');
    renderHome();
  } catch (e) {
    toast('❌ Не удалось открыть файл: ' + e.message);
  }
  input.value = '';
}

/* ================== Вход ================== */
async function doLogin() {
  const u = document.getElementById('username').value.trim().toUpperCase();
  const p = document.getElementById('password').value;
  const errEl = document.getElementById('loginErr');
  if (!u || !p) { errEl.textContent = 'Введите логин и пароль'; return; }
  const h = await sha256(p);
  if (userHashes[u] && userHashes[u] === h) {
    currentUser = u;
    errEl.textContent = '';
    document.getElementById('login').classList.add('hidden');
    document.getElementById('home').classList.remove('hidden');
    // Единый поиск по всем магазинам — только админу
    document.getElementById('adminSearchBox').classList.toggle('hidden', u !== 'SANAT');
    await autoLoadAll(false);
    startAutoRefresh();
  } else {
    errEl.textContent = 'Неверный логин или пароль';
  }
}

/* ---------- Единый поиск по всем трём базам (админ) ---------- */
function renderGlobalSearch() {
  const box = document.getElementById('globalResults');
  const q = document.getElementById('globalSearch').value.trim().toLowerCase();
  if (q.length < 2) { box.innerHTML = ''; return; }
  const qs = q.replace(/'/g, "''");

  let totalFound = 0;
  let html = '';
  for (const [storeId, name] of Object.entries(storeNames)) {
    const info = storeDbs[storeId];
    if (!info) continue;
    // Точное совпадение IMEI/штрихкода — первым, затем по названию
    const rows = execToObjects(info.db,
      "SELECT name, category, imei, barcode, quantity, salePrice, updatedAt FROM products " +
      "WHERE LOWER(name) LIKE '%" + qs + "%' OR LOWER(imei) LIKE '%" + qs + "%' OR LOWER(barcode) LIKE '%" + qs + "%' " +
      "ORDER BY CASE WHEN LOWER(imei) = '" + qs + "' OR LOWER(barcode) = '" + qs + "' THEN 0 " +
      "WHEN quantity > 0 THEN 1 ELSE 2 END, name LIMIT 50");
    // История продаж по IMEI/штрихкоду — сохраняется навсегда, даже для проданных
    const history = execToObjects(info.db,
      "SELECT s.productName, s.total, s.quantity, s.date, s.sellerName, s.comment, p.imei, p.barcode FROM sales s " +
      "JOIN products p ON p.id = s.productId " +
      "WHERE s.type = 'sale' AND (LOWER(p.imei) LIKE '%" + qs + "%' OR LOWER(p.barcode) LIKE '%" + qs + "%') " +
      "ORDER BY s.date DESC LIMIT 20");

    if (rows.length === 0 && history.length === 0) continue;
    totalFound += rows.length + history.length;
    const inStock = rows.filter(r => (Number(r.quantity) || 0) > 0).length;
    html += `<div class="card">
      <div class="card-head"><span>🏪 ${esc(name)}</span>
      <span class="badge ${inStock > 0 ? 'b-green' : 'b-red'}">${rows.length} найдено • в наличии ${inStock}</span></div>`;
    for (const p of rows) {
      const qty = Number(p.quantity) || 0;
      const details = [p.imei, p.barcode && p.barcode !== p.imei ? p.barcode : null].filter(Boolean).join(' • ');
      html += `<div class="row">
        <div style="flex:1;min-width:140px;">
          <div class="nm">${esc(p.name) || 'Без названия'}</div>
          ${details ? '<div class="sub2">' + esc(details) + '</div>' : ''}
        </div>
        <span class="badge ${qty > 0 ? 'b-green' : 'b-red'}">${qty > 0 ? 'В НАЛИЧИИ: ' + qty + ' шт. • ' + fmt(p.salePrice) + ' сум' : 'ПРОДАН / НЕТ'}</span>
      </div>`;
    }
    if (history.length > 0) {
      html += '<div class="card-head" style="background:rgba(139,92,246,0.08);"><span>🕐 История продаж (IMEI сохраняется навсегда)</span><span class="badge b-violet">' + history.length + '</span></div>';
      for (const h of history) {
        html += `<div class="row" style="display:block;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span class="nm">${esc(h.productName) || 'Товар'}</span>
            <span class="badge b-violet">ПРОДАН за ${fmt(h.total)} сум</span>
          </div>
          <div class="meta">📅 ${fmtDate(h.date)} ${fmtTime(h.date)} &nbsp;|&nbsp; 👤 ${esc(h.sellerName) || '—'}${h.imei ? ' &nbsp;|&nbsp; IMEI: ' + esc(h.imei) : ''}</div>
          ${h.comment ? '<div class="meta">💬 ' + esc(h.comment) + '</div>' : ''}
        </div>`;
      }
    }
    html += '</div>';
  }
  if (totalFound === 0) {
    html = '<div class="empty">🔍 «' + esc(q) + '» — ничего не найдено ни в одном магазине</div>';
  } else {
    html = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">🔍 «' + esc(q) + '»: найдено ' + totalFound + ' совпадений</div>' + html;
  }
  box.innerHTML = html;
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    for (const storeId of Object.keys(storeFiles)) {
      try { await loadStoreDb(storeId); } catch (e) { /* повторим в следующий цикл */ }
    }
    if (!document.getElementById('home').classList.contains('hidden')) renderHome();
    else if (currentStoreId) renderStoreData();
    const gs = document.getElementById('globalSearch');
    if (gs && gs.value.trim().length >= 2 && !document.getElementById('home').classList.contains('hidden')) renderGlobalSearch();
  }, AUTO_REFRESH_MS);
}

/* ================== Главная ================== */
function renderHome() {
  const grid = document.getElementById('storeGrid');
  let html = '';
  let netVal = 0, netQty = 0, netCount = 0, loaded = 0;

  for (const [storeId, name] of Object.entries(storeNames)) {
    const info = storeDbs[storeId];
    if (info) {
      loaded++;
      const count = Number(scalar(info.db, 'SELECT COUNT(*) FROM products WHERE quantity > 0')) || 0;
      const qty = Number(scalar(info.db, 'SELECT COALESCE(SUM(quantity),0) FROM products WHERE quantity > 0')) || 0;
      const val = Number(scalar(info.db, 'SELECT COALESCE(SUM(salePrice*quantity),0) FROM products WHERE quantity > 0')) || 0;
      const debts = Number(scalar(info.db, "SELECT COALESCE(SUM(MAX(amount - COALESCE(paid,0), 0)),0) FROM debts WHERE isPaid = 0 OR isPaid IS NULL")) || 0;
      const lastUpd = scalar(info.db, 'SELECT MAX(updatedAt) FROM products');
      netVal += val; netQty += qty; netCount += count;

        <div class="sname">🏪 ${esc(name)}</div>

        <div class="sfresh">🕐 Данные: ${lastUpd ? fmtDate(lastUpd) + ' ' + fmtTime(lastUpd) : '—'}</div>
        <label class="upload-btn" onclick="event.stopPropagation();">📁 Загрузить базу
          <input type="file" accept=".db" onchange="handleFile('${storeId}', this)"></label>

    } else {
      html += `<div class="store-card" style="background:linear-gradient(140deg,#374151,#1f2937);" onclick="toast('Сначала загрузите базу')">
        <div class="sname">🏪 ${esc(name)}</div>
        <div class="sstats">База не загружена</div>
        <label class="upload-btn" onclick="event.stopPropagation();">📁 Загрузить базу
          <input type="file" accept=".db" onchange="handleFile('${storeId}', this)"></label>
      </div>`;
    }
  }
  grid.innerHTML = html;

  document.getElementById('netSummary').innerHTML = `
    <div class="net-card"><div class="v" style="color:#4ade80">${fmt(netVal)}</div><div class="l">сум — товар на складах</div></div>
    <div class="net-card"><div class="v" style="color:#60a5fa">${netQty}</div><div class="l">штук всего (${netCount} позиций)</div></div>
    <div class="net-card"><div class="v" style="color:#a78bfa">${loaded}/3</div><div class="l">магазинов онлайн</div></div>`;

  renderAdminAnalytics();
}

/* ================== Аналитика для админа (по всем магазинам) ================== */
function renderAdminAnalytics() {
  const box = document.getElementById('adminAnalytics');
  if (!box) return;
  if (currentUser !== 'SANAT') { box.innerHTML = ''; return; }

  const now = new Date();
  const ago = days => localISO(new Date(now.getFullYear(), now.getMonth(), now.getDate() - days, 0, 0, 0));

  // --- Выручка по дням (последние 7 дней, все магазины) ---
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i, 12, 0, 0);
    days.push({ key: dayKey(d.toISOString()), label: d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', weekday: 'short' }), total: 0, perStore: {} });
  }
  const dayMap = Object.fromEntries(days.map(d => [d.key, d]));

  // --- Ходовые товары (30 дней) и продажи для «залежавшихся» (60 дней) ---
  const topMap = {};          // name -> {qty, total}
  const soldRecently = {};    // storeId -> Set(productId) за 60 дней
  const sellerMap = {};       // продавец -> {cnt, qty, rev, prof} за текущий месяц (все магазины)
  const mStart = localISO(new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0));
  const mEnd = localISO(new Date(now.getFullYear(), now.getMonth() + 1, 1, 0, 0, 0));

  for (const [storeId, name] of Object.entries(storeNames)) {
    const info = storeDbs[storeId];
    if (!info) continue;
    const sales7 = execToObjects(info.db, "SELECT date, total FROM sales WHERE type='sale' AND date >= ?", [ago(7)]);
    for (const s of sales7) {
      const d = dayMap[dayKey(s.date)];
      if (d) { d.total += Number(s.total) || 0; d.perStore[name] = (d.perStore[name] || 0) + (Number(s.total) || 0); }
    }
    const top30 = execToObjects(info.db, "SELECT productName, SUM(quantity) q, SUM(total) t FROM sales WHERE type='sale' AND date >= ? GROUP BY productName", [ago(30)]);
    for (const r of top30) {
      const k = (r.productName || 'Товар').trim();
      if (!topMap[k]) topMap[k] = { qty: 0, total: 0 };
      topMap[k].qty += Number(r.q) || 0; topMap[k].total += Number(r.t) || 0;
    }
    soldRecently[storeId] = new Set(execToObjects(info.db, "SELECT DISTINCT productId FROM sales WHERE date >= ?", [ago(60)]).map(r => r.productId));
    const sellersM = execToObjects(info.db,
      "SELECT sellerName, COUNT(*) cnt, COALESCE(SUM(quantity),0) qty, COALESCE(SUM(total),0) rev, COALESCE(SUM(profit),0) prof " +
      "FROM sales WHERE type='sale' AND date >= ? AND date < ? GROUP BY sellerName", [mStart, mEnd]);
    for (const r of sellersM) {
      const k = (r.sellerName || '—').trim().toUpperCase();
      if (!sellerMap[k]) sellerMap[k] = { cnt: 0, qty: 0, rev: 0, prof: 0 };
      sellerMap[k].cnt += Number(r.cnt) || 0; sellerMap[k].qty += Number(r.qty) || 0;
      sellerMap[k].rev += Number(r.rev) || 0; sellerMap[k].prof += Number(r.prof) || 0;
    }
  }

  const maxDay = Math.max(1, ...days.map(d => d.total));
  let html = '<div class="card"><div class="card-head"><span>📅 Выручка по дням (все магазины)</span><span class="badge b-blue">7 дней</span></div>';
  for (const d of days) {
    const w = Math.round(d.total / maxDay * 100);
    const perStore = Object.entries(d.perStore).map(([n, v]) => n.replace('PRO MAX — ', '') + ': ' + fmt(v)).join(' • ');
    html += `<div class="row" style="display:block;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span class="nm" style="min-width:110px;">${d.label}</span>
        <span class="badge ${d.total > 0 ? 'b-green' : 'b-blue'}">${d.total > 0 ? fmt(d.total) + ' сум' : '—'}</span>
      </div>
      <div style="height:6px;border-radius:3px;background:rgba(255,255,255,0.06);margin-top:6px;">
        <div style="height:6px;border-radius:3px;width:${w}%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);"></div>
      </div>
      ${perStore ? '<div class="sub2" style="margin-top:4px;">' + esc(perStore) + '</div>' : ''}
    </div>`;
  }
  html += '</div>';

  // --- Ходовые товары ---
  const top = Object.entries(topMap).sort((a, b) => b[1].qty - a[1].qty).slice(0, 5);
  if (top.length > 0) {
    html += '<div class="card"><div class="card-head"><span>🔥 Ходовые товары</span><span class="badge b-green">30 дней</span></div>';
    top.forEach(([nm, v], i) => {
      html += `<div class="row"><span class="nm">${i + 1}. ${esc(nm)}</span><span class="badge b-green">${v.qty} шт • ${fmt(v.total)} сум</span></div>`;
    });
    html += '</div>';
  }

  // --- Конкурс продавцов месяца (все магазины, бонус 5% от прибыли) ---
  const sellerRows = Object.entries(sellerMap).sort((a, b) => b[1].prof - a[1].prof);
  if (sellerRows.length > 0) {
    const medals = ['🥇', '🥈', '🥉'];
    const maxProf = Math.max(1, ...sellerRows.map(([, v]) => v.prof));
    const monthName = now.toLocaleString('ru-RU', { month: 'long' });
    html += '<div class="card"><div class="card-head"><span>🏆 Конкурс продавцов — ' + esc(monthName) + '</span><span class="badge b-amber">5% от прибыли</span></div>';
    sellerRows.forEach(([nm, v], i) => {
      const bonus = v.prof * SELLER_BONUS_PCT / 100;
      const w = Math.round(v.prof / maxProf * 100);
      html += `<div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span class="nm">${medals[i] || (i + 1) + '.'} ${esc(nm)}</span>
          <span class="badge ${i === 0 ? 'b-amber' : 'b-violet'}">прибыль ${fmt(v.prof)} сум</span>
        </div>
        <div style="height:6px;border-radius:3px;background:rgba(255,255,255,0.06);margin-top:6px;">
          <div style="height:6px;border-radius:3px;width:${w}%;background:linear-gradient(90deg,#f59e0b,#8b5cf6);"></div>
        </div>
        <div class="meta">${v.cnt} продаж • ${v.qty} шт &nbsp;|&nbsp; 💰 Бонус: <b style="color:#4ade80">${fmt(bonus)} сум</b></div>
      </div>`;
    });
    html += '</div>';
  }

  // --- Мало продаётся (в наличии, без продаж 60+ дней) ---
  const slow = [];
  for (const [storeId, name] of Object.entries(storeNames)) {
    const info = storeDbs[storeId];
    if (!info) continue;
    const stock = execToObjects(info.db, 'SELECT id, name, quantity, salePrice, updatedAt FROM products WHERE quantity > 0');
    const recent = soldRecently[storeId] || new Set();
    for (const p of stock) {
      if (recent.has(p.id)) continue;
      const daysIdle = p.updatedAt ? Math.max(0, Math.floor((now - new Date(p.updatedAt)) / 86400000)) : 999;
      slow.push({ name: p.name, qty: p.quantity, val: (Number(p.salePrice) || 0) * (Number(p.quantity) || 0), daysIdle, store: name.replace('PRO MAX — ', '') });
    }
  }
  slow.sort((a, b) => b.val - a.val);
  if (slow.length > 0) {
    const slowVal = slow.reduce((s, x) => s + x.val, 0);
    html += `<div class="card"><div class="card-head"><span>🐌 Мало продаётся (60+ дней)</span><span class="badge b-red">${slow.length} поз. • ${fmt(slowVal)} сум заморожено</span></div>`;
    for (const x of slow.slice(0, 7)) {
      html += `<div class="row">
        <div style="flex:1;min-width:140px;"><div class="nm">${esc(x.name) || 'Товар'}</div><div class="sub2">${esc(x.store)} • без движения ~${x.daysIdle} дн.</div></div>
        <span class="badge b-red">${x.qty} шт • ${fmt(x.val)} сум</span>
      </div>`;
    }
    if (slow.length > 7) html += '<div class="row" style="justify-content:center;color:var(--muted);font-size:12px;">…и ещё ' + (slow.length - 7) + ' позиций</div>';
    html += '</div>';
  }

  box.innerHTML = html;
}

/* ================== Страница магазина ================== */
function openStore(storeId) {
  if (!storeDbs[storeId]) { toast('Сначала загрузите базу для этого магазина'); return; }
  currentStoreId = storeId;
  reportOffset = 0;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('storePage').classList.remove('hidden');
  document.getElementById('storeTitle').textContent = storeNames[storeId] || storeId;
  showStoreTab('stock');
}
function goHome() {
  document.getElementById('storePage').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderHome();
}
function showStoreTab(tab) {
  currentStoreTab = tab;
  ['stock','sales','cash','debts','expenses','barters','reminders','report','sellers'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', tab === t);
  });
  renderStoreData();
}
async function refreshCurrent() {
  try {
    await loadStoreDb(currentStoreId);
    renderStoreData();
    toast('🔄 Данные обновлены');
  } catch (e) {
    toast('❌ Не удалось обновить: ' + e.message);
  }
}

function renderStoreData() {
  const content = document.getElementById('storeContent');
  const info = storeDbs[currentStoreId];
  if (!info) { content.innerHTML = '<div class="error-box">База не загружена</div>'; return; }
  try {
    if (currentStoreTab === 'stock') renderStoreStock();
    else if (currentStoreTab === 'sales') renderStoreSales();
    else if (currentStoreTab === 'cash') renderStoreCash();
    else if (currentStoreTab === 'debts') renderStoreDebts();
    else if (currentStoreTab === 'expenses') renderStoreExpenses();
    else if (currentStoreTab === 'barters') renderStoreBarters();
    else if (currentStoreTab === 'reminders') renderStoreReminders();
    else if (currentStoreTab === 'sellers') renderStoreSellers();
    else renderStoreReport();
  } catch (e) {
    console.error(e);
    content.innerHTML = '<div class="error-box">⚠️ ' + esc(e.message) + '</div>';
  }
  document.getElementById('storeUpdated').textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');
  document.getElementById('syncPill').textContent = '🕐 База от ' + (info.loadedAt ? info.loadedAt.toLocaleTimeString('ru-RU') : '—');
}

function searchQuery() {
  return document.getElementById('storeSearch').value.trim().toLowerCase();
}

/* ---------- Остатки ---------- */
function renderStoreStock() {
  const q = searchQuery().replace(/'/g, "''");
  const db = storeDbs[currentStoreId].db;
  let sql = 'SELECT * FROM products WHERE quantity > 0';
  if (q) sql += " AND (LOWER(name) LIKE '%" + q + "%' OR LOWER(barcode) LIKE '%" + q + "%' OR LOWER(imei) LIKE '%" + q + "%')";
  sql += ' ORDER BY name';
  const list = execToObjects(db, sql);

  if (list.length === 0) {
    document.getElementById('storeContent').innerHTML = '<div class="empty">📦 Нет товаров в наличии</div>';
    return;
  }

  const categoryNames = { phone: '📱 Телефоны', accessory: '🎧 Аксессуары', part: '🔧 Запчасти', drink: '🥤 Напитки', laptop: '💻 Ноутбуки', tablet: '📟 Планшеты' };
  const groups = {};
  for (const p of list) {
    const cat = p.category === 'energy' ? 'drink' : (p.category || 'unknown');
    (groups[cat] = groups[cat] || []).push(p);
  }
  const catOrder = ['phone', 'accessory', 'part', 'drink', 'laptop', 'tablet'];
  const orderedCats = [...catOrder.filter(c => groups[c]), ...Object.keys(groups).filter(c => !catOrder.includes(c))];

  let html = '';
  for (const cat of orderedCats) {
    const items = groups[cat];
    const catTotal = items.reduce((s, p) => s + (Number(p.salePrice) || 0) * (Number(p.quantity) || 0), 0);
    const catQty = items.reduce((s, p) => s + (Number(p.quantity) || 0), 0);
    html += `<div class="card">
      <div class="card-head"><span>${categoryNames[cat] || esc(cat)}</span>
      <span class="badge b-violet">${items.length} поз. • ${catQty} шт. • ${fmt(catTotal)} сум</span></div>`;
    for (const p of items) {
      const phoneInfo = p.category === 'phone' ? [p.capacity, p.ram, p.batteryHealth, p.imei].filter(Boolean).join(' • ') : '';
      html += `<div class="row">
        <div style="flex:1;min-width:140px;">
          <div class="nm">${esc(p.name) || 'Без названия'}</div>
          ${phoneInfo ? '<div class="sub2">' + esc(phoneInfo) + '</div>' : ''}
        </div>
        <span class="badge b-green">${Number(p.quantity) || 0} шт. × ${fmt(p.salePrice)} сум</span>
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('storeContent').innerHTML = html;
}

/* ---------- Продажи (группировка по ЛОКАЛЬНЫМ дням — без бага UTC) ---------- */
function renderStoreSales() {
  const db = storeDbs[currentStoreId].db;
  const query = searchQuery();
  let list = execToObjects(db, "SELECT * FROM sales WHERE type = 'sale' ORDER BY date DESC");
  if (query) list = list.filter(s =>
    (s.productName || '').toLowerCase().includes(query) ||
    (s.sellerName || '').toLowerCase().includes(query));

  if (list.length === 0) {
    document.getElementById('storeContent').innerHTML = '<div class="empty">💰 Нет продаж</div>';
    return;
  }

  const dayGroups = {};
  for (const s of list) {
    const dk = dayKey(s.date);
    if (!dayGroups[dk]) dayGroups[dk] = { sales: [], total: 0, profit: 0 };
    dayGroups[dk].sales.push(s);
    dayGroups[dk].total += Number(s.total) || 0;
    dayGroups[dk].profit += Number(s.profit) || 0;
  }

  let html = '';
  for (const dk of Object.keys(dayGroups).sort().reverse()) {
    const g = dayGroups[dk];
    const d = new Date(dk === 'unknown' ? 0 : dk + 'T12:00:00');
    const dayLabel = dk === 'unknown' ? 'Без даты' :
      d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'short' });
    html += `<div class="card">
      <div class="card-head"><span>📅 ${dayLabel}</span>
      <span class="badge b-blue">${fmt(g.total)} сум • ${g.sales.length} продаж</span></div>`;
    for (const s of g.sales) {
      html += `<div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span class="nm">${esc(s.productName) || 'Товар'}</span>
          <span class="badge b-violet">${fmt(s.total)} сум</span>
        </div>
        <div class="meta">${s.quantity || 1} шт. × ${fmt(s.price)} сум &nbsp;|&nbsp; 👤 ${esc(s.sellerName) || '—'} &nbsp;|&nbsp; 🕐 ${fmtTime(s.date)}${s.profit ? ' &nbsp;|&nbsp; 📈 +' + fmt(s.profit) : ''}</div>
        ${s.comment ? '<div class="comment">💬 ' + esc(s.comment) + '</div>' : ''}
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('storeContent').innerHTML = html;
}

/* ---------- Касса: разбор типа оплаты по комментарию ---------- */
// Комментарии заполняются вручную: "ishonch 11404000", "clik", "nalichiga" и т.п.
// Поэтому расчёт приблизительный: ищем ключевые слова и сумму рядом с ними.
function classifyPayment(comment, total) {
  const c = (' ' + (comment || '').toLowerCase() + ' ');
  // Кредитные компании: Ishonch, Uzum Nasiya, Alif — каждая копится отдельно
  const creditCompanies = [
    { name: 'Ishonch', words: ['ishonch'] },
    { name: 'Uzum', words: ['uzum'] },
    { name: 'Alif', words: ['alif'] },
    { name: 'Кредит', words: ['kredit', 'кредит', 'nasiya', 'nassiya', 'rassroch', 'рассроч', 'dolg', 'долг', 'qarz'] }
  ];
  const transferWords = ['clik', 'click', 'kilk', 'klik', 'perevod', 'перевод', 'payme', 'karta', 'карт', 'terminal'];
  const cashWords = ['nalichi', 'налич', 'cash'];
  let company = null;
  for (const cc of creditCompanies) {
    if (cc.words.some(w => c.includes(w))) { company = cc.name; break; }
  }
  const hasCredit = company !== null;
  const hasTransfer = transferWords.some(w => c.includes(w));
  const hasCash = cashWords.some(w => c.includes(w));

  // Числа в комментарии (с пробелами вида "13 600 000")
  const nums = (c.replace(/[^\d\s]/g, ' ').match(/\d[\d\s]*\d|\d/g) || [])
    .map(s => Number(s.replace(/\s/g, '')))
    .filter(n => n > 1000);
  const t = Number(total) || 0;
  // Сумма рядом с ключевым словом: ближайшая к цене продажи (0.3×–1.6×)
  let part = 0;
  for (const n of nums) {
    if (n >= t * 0.3 && n <= t * 1.6 && (part === 0 || Math.abs(n - t) < Math.abs(part - t))) part = n;
  }
  // Явный процент в комментарии: "ishonch 10%"
  const pctMatch = c.match(/(\d{1,2})\s*%/);

  if (hasCredit && !hasTransfer) {
    const label = company.toUpperCase();
    if (part > t) { // кредит с наценкой: сумма больше цены — разница = процент
      const mk = part - t;
      const pct = Math.round(mk / t * 1000) / 10;
      return { cash: 0, transfer: 0, credit: part, markup: mk, company, label: 'КРЕДИТ: ' + label + ' +' + pct + '%', cls: 'b-amber' };
    }
    if (part > 0) { // частичный кредит (половина кредит, половина нал)
      return { cash: t - part, transfer: 0, credit: part, markup: 0, company, label: 'СМЕШ + ' + label, cls: 'b-amber' };
    }
    if (pctMatch) { // написан только процент — наценку считаем сами
      const mk = Math.round(t * Number(pctMatch[1]) / 100);
      return { cash: 0, transfer: 0, credit: t + mk, markup: mk, company, label: 'КРЕДИТ: ' + label + ' +' + pctMatch[1] + '%', cls: 'b-amber' };
    }
    return { cash: 0, transfer: 0, credit: t, markup: 0, company, label: 'КРЕДИТ: ' + label, cls: 'b-amber' };
  }
  if (hasTransfer && !hasCredit) {
    if (part > 0 && part < t) return { cash: t - part, transfer: part, credit: 0, markup: 0, company: null, label: 'СМЕШ + ПЕРЕВОД', cls: 'b-blue' };
    return { cash: 0, transfer: t, credit: 0, markup: 0, company: null, label: 'ПЕРЕВОД', cls: 'b-blue' };
  }
  if (hasCredit && hasTransfer) {
    if (part > t) {
      const mk = part - t;
      return { cash: 0, transfer: 0, credit: part, markup: mk, company, label: 'КРЕДИТ: ' + company.toUpperCase(), cls: 'b-amber' };
    }
    return { cash: 0, transfer: 0, credit: t, markup: 0, company, label: 'КРЕДИТ: ' + company.toUpperCase(), cls: 'b-amber' };
  }
  return { cash: t, transfer: 0, credit: 0, markup: 0, company: null, label: 'НАЛИЧНЫЕ', cls: 'b-green' };
}

function renderStoreCash() {

  const expenses = execToObjects(db, 'SELECT * FROM expenses ORDER BY date DESC');

    const total = Number(s.total) || 0;
    const p = classifyPayment(s.comment, total);
    cashIn += p.cash; transferIn += p.transfer; creditOut += p.credit; markupTotal += p.markup || 0;
    rows.push({ s, p });

    const cat = s.pcategory === 'energy' ? 'drink' : (s.pcategory || 'other');
    if (!byDept[cat]) byDept[cat] = { cash: 0, transfer: 0, credit: 0, count: 0 };
    byDept[cat].cash += p.cash; byDept[cat].transfer += p.transfer; byDept[cat].credit += p.credit; byDept[cat].count++;
    if (cat === 'laptop') {
      const q = Number(s.quantity) || 1;
      lapQty += q;
      const mk = String(s.date || '').slice(0, 7);
      if (mk.length === 7) lapMonths[mk] = (lapMonths[mk] || 0) + q;

    if (p.credit > 0) {
      const comp = p.company || 'Кредит';
      if (!byCompany[comp]) byCompany[comp] = { sum: 0, count: 0, markup: 0 };
      byCompany[comp].sum += p.credit; byCompany[comp].count++; byCompany[comp].markup += p.markup || 0;
      const seller = s.sellerName || '—';
      if (!bySeller[seller]) bySeller[seller] = { sum: 0, count: 0, markup: 0 };
      bySeller[seller].sum += p.credit; bySeller[seller].count++; bySeller[seller].markup += p.markup || 0;
    }
  }
  const totalExpenses = expenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
  const kassa = cashIn - totalExpenses;

  const todayKey = dayKey(new Date().toISOString());

}

function renderStoreDebts() {

  let list = execToObjects(db, 'SELECT * FROM reminders ORDER BY date ASC');
  if (query) list = list.filter(r => (r.title || '').toLowerCase().includes(query));

  if (list.length === 0) {
    document.getElementById('storeContent').innerHTML = '<div class="empty">🔔 Нет напоминаний</div>';
    return;
  }
  let html = '';
  for (const r of list) {
    const isDone = !!r.isDone;
    html += `<div class="card" style="${isDone ? 'opacity:.55;' : ''}"><div class="row" style="display:block;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span class="nm" style="${isDone ? 'text-decoration:line-through;' : ''}">${esc(r.title) || 'Без названия'}</span>
        <span class="badge ${isDone ? 'b-green' : 'b-amber'}">${isDone ? '✅ Выполнено' : '⏳ Активно'}</span>
      </div>
      <div class="meta">📅 ${fmtDate(r.date)} ${fmtTime(r.date)}</div>
      ${r.description ? '<div class="meta">📝 ' + esc(r.description) + '</div>' : ''}
    </div></div>`;
  }
  document.getElementById('storeContent').innerHTML = html;
}

/* ---------- Отчёт (локальные границы месяца — без бага UTC) ---------- */
function shiftReport(d) {
  reportOffset = Math.min(0, reportOffset + d);
  renderStoreReport();
}

function renderStoreReport() {
  const db = storeDbs[currentStoreId].db;
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + reportOffset, 1);
  const monthStart = localISO(new Date(base.getFullYear(), base.getMonth(), 1, 0, 0, 0));
  const monthEnd = localISO(new Date(base.getFullYear(), base.getMonth() + 1, 1, 0, 0, 0));

  const sales = execToObjects(db, "SELECT * FROM sales WHERE type = 'sale' AND date >= ? AND date < ? ORDER BY date", [monthStart, monthEnd]);
  const expenses = execToObjects(db, 'SELECT * FROM expenses WHERE date >= ? AND date < ? ORDER BY date DESC', [monthStart, monthEnd]);
  const barters = execToObjects(db, 'SELECT * FROM barters WHERE date >= ? AND date < ? ORDER BY date DESC', [monthStart, monthEnd]);

  let totalSales = 0, totalCost = 0, totalProfit = 0, totalQty = 0;
  let drinkSales = 0, drinkProfit = 0, drinkQty = 0;
  const drinkNames = ['cola', 'fanta', 'sprite', 'lipton', 'pepsi', 'rockstar', 'adrenalin', 'red bull', 'flash'];
  const byDay = {};

  for (const s of sales) {
    const qty = Number(s.quantity) || 1;
    const price = Number(s.price) || 0;
    const purchasePrice = Number(s.purchasePrice) || 0;
    const total = Number(s.total) || (price * qty);
    const profit = Number(s.profit) || ((price - purchasePrice) * qty);
    totalSales += total;
    totalCost += purchasePrice * qty;
    totalProfit += profit;
    totalQty += qty;
    const dk = dayKey(s.date);
    byDay[dk] = (byDay[dk] || 0) + total;
    const pName = (s.productName || '').toLowerCase();
    if (drinkNames.some(d => pName.includes(d))) {
      drinkSales += total; drinkProfit += profit; drinkQty += qty;
    }
  }

  let totalExpenses = 0;
  const expenseCategories = {};
  for (const e of expenses) {
    const amt = Number(e.amount) || 0;
    totalExpenses += amt;
    const cat = e.category || 'Прочее';
    expenseCategories[cat] = (expenseCategories[cat] || 0) + amt;
  }

  const netProfit = totalProfit - totalExpenses;
  const monthName = base.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

  let html = `<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;">
    <button class="icon-btn" style="padding:8px 16px;" onclick="shiftReport(-1)">◀</button>
    <div style="font-size:18px;font-weight:800;color:#a78bfa;min-width:170px;text-align:center;">📊 ${monthName}</div>
    <button class="icon-btn" style="padding:8px 16px;${reportOffset >= 0 ? 'opacity:.35;pointer-events:none;' : ''}" onclick="shiftReport(1)">▶</button>
  </div>`;
  html += `<div class="report-grid">
    <div class="report-card"><div class="icon">💰</div><div class="label">Выручка</div><div class="value" style="color:#60a5fa;">${fmt(totalSales)} сум</div></div>
    <div class="report-card"><div class="icon">📦</div><div class="label">Себестоимость</div><div class="value" style="color:#fb923c;">${fmt(totalCost)} сум</div></div>
    <div class="report-card"><div class="icon">📈</div><div class="label">Валовая прибыль</div><div class="value" style="color:#4ade80;">${fmt(totalProfit)} сум</div></div>
    <div class="report-card"><div class="icon">💳</div><div class="label">Расходы</div><div class="value" style="color:#f87171;">${fmt(totalExpenses)} сум</div></div>
  </div>`;

  // График продаж по дням
  html += `<div class="chart-box"><div class="ct">📈 Продажи по дням (сум)</div><canvas id="salesChart" height="180"></canvas></div>`;

  if (drinkSales > 0) {
    html += `<div class="card" style="border-color:rgba(59,130,246,0.35);"><div class="row">
      <div><div class="nm">🥤 Напитки и энергетики</div><div class="meta">${drinkQty} шт. продано • прибыль ${fmt(drinkProfit)} сум</div></div>
      <span class="badge b-blue">${fmt(drinkSales)} сум</span>
    </div></div>`;
  }

  const npColor = netProfit >= 0 ? '#4ade80' : '#f87171';
  html += `<div class="net-profit" style="background:${netProfit >= 0 ? 'rgba(34,197,94,0.1)' : 'rgba(239,68,68,0.1)'};border:1px solid ${netProfit >= 0 ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.35)'};">
    <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">💎 ЧИСТАЯ ПРИБЫЛЬ (прибыль − расходы)</div>
    <div style="font-size:28px;font-weight:800;color:${npColor};">${fmt(netProfit)} сум</div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Продано ${totalQty} шт. за месяц</div>
  </div>`;

  if (Object.keys(expenseCategories).length > 0) {
    html += '<div class="card"><div class="card-head"><span>💸 Расходы по категориям</span></div>';
    for (const [cat, amount] of Object.entries(expenseCategories).sort((a, b) => b[1] - a[1])) {
      html += `<div class="row"><span class="nm">${esc(cat)}</span><span class="badge b-red">${fmt(amount)} сум</span></div>`;
    }
    html += '</div>';
  }

  if (barters.length > 0) {
    html += '<div class="card"><div class="card-head"><span>🔄 Бартеры за месяц</span><span class="badge b-violet">' + barters.length + '</span></div>';
    for (const b of barters) {
      const diff = Number(b.cashDifference) || 0;
      const cls = diff > 0 ? 'b-green' : (diff < 0 ? 'b-red' : 'b-blue');
      const diffText = diff > 0 ? '+' + fmt(diff) : (diff < 0 ? '−' + fmt(-diff) : '0');
      html += `<div class="row"><span class="nm">${esc(b.giveProductName) || 'Товар'} ↔ ${esc(b.receiveProductName) || 'Товар'}</span><span class="badge ${cls}">${diffText} сум</span></div>`;
    }
    html += '</div>';
  }

  if (sales.length === 0 && expenses.length === 0 && barters.length === 0) {
    html += '<div class="empty">Нет данных за этот месяц</div>';
  }

  document.getElementById('storeContent').innerHTML = html;
  try { drawSalesChart(byDay, base); } catch (e) { console.error('chart error', e); }
}

function drawSalesChart(byDay, base) {
  const canvas = document.getElementById('salesChart');
  if (!canvas || typeof Chart === 'undefined') return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const now = new Date();
  const isCurrentMonth = base.getFullYear() === now.getFullYear() && base.getMonth() === now.getMonth();
  const lastDay = isCurrentMonth ? now.getDate() : new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  const labels = [], data = [];
  for (let d = 1; d <= lastDay; d++) {
    const p = n => String(n).padStart(2, '0');
    const key = base.getFullYear() + '-' + p(base.getMonth() + 1) + '-' + p(d);
    labels.push(d);
    data.push(Math.round(byDay[key] || 0));
  }
  const axisFmt = v => v >= 1000000 ? (+(v / 1000000).toFixed(1)) + ' млн' : (v >= 1000 ? Math.round(v / 1000) + ' тыс.' : v);
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 180);
  grad.addColorStop(0, 'rgba(139,92,246,0.55)');
  grad.addColorStop(1, 'rgba(139,92,246,0.02)');
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: grad, borderColor: '#8b5cf6', borderWidth: 1, borderRadius: 5 }] },
    options: {
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmt(c.parsed.y) + ' сум' } } },
      scales: {
        x: { ticks: { color: '#8b93a9', font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: '#8b93a9', font: { size: 10 }, callback: axisFmt }, grid: { color: 'rgba(255,255,255,0.05)' } }
      },
      maintainAspectRatio: true
    }
  });
}

/* ---------- Продавцы: рейтинг за месяц + бонус 5% от прибыли ---------- */
function shiftSellerMonth(d) {
  sellerMonthOffset = Math.min(0, sellerMonthOffset + d);
  renderStoreSellers();
}

function renderStoreSellers() {
  const db = storeDbs[currentStoreId].db;
  const isAdmin = currentUser === 'SANAT'; // прибыль, проценты и бонусы видит только админ
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + sellerMonthOffset, 1);
  const monthStart = localISO(new Date(base.getFullYear(), base.getMonth(), 1, 0, 0, 0));
  const monthEnd = localISO(new Date(base.getFullYear(), base.getMonth() + 1, 1, 0, 0, 0));
  const monthName = base.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

  const rows = execToObjects(db,
    "SELECT sellerName, COUNT(*) cnt, COALESCE(SUM(quantity),0) qty, COALESCE(SUM(total),0) rev, COALESCE(SUM(profit),0) prof " +
    "FROM sales WHERE type = 'sale' AND date >= ? AND date < ? GROUP BY sellerName ORDER BY " + (isAdmin ? "prof" : "rev") + " DESC", [monthStart, monthEnd]);

  const medals = ['🥇', '🥈', '🥉'];
  const key = isAdmin ? 'prof' : 'rev'; // сотрудникам рейтинг по выручке, прибыль скрыта
  const maxVal = Math.max(1, ...rows.map(r => Number(r[key]) || 0));

  let html = `<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;">
    <button class="icon-btn" style="padding:8px 16px;" onclick="shiftSellerMonth(-1)">◀</button>
    <div style="font-size:18px;font-weight:800;color:#a78bfa;min-width:170px;text-align:center;">🏆 ${monthName}</div>
    <button class="icon-btn" style="padding:8px 16px;${sellerMonthOffset >= 0 ? 'opacity:.35;pointer-events:none;' : ''}" onclick="shiftSellerMonth(1)">▶</button>
  </div>`;

  if (rows.length === 0) {
    html += '<div class="empty">🏆 За этот месяц продаж нет</div>';
    document.getElementById('storeContent').innerHTML = html;
    return;
  }

  // Победитель месяца
  const best = rows[0];
  html += `<div class="net-profit" style="background:linear-gradient(135deg,rgba(251,191,36,0.14),rgba(139,92,246,0.12));border:1px solid rgba(251,191,36,0.4);margin-top:0;">
    <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">👑 ЛУЧШИЙ ПРОДАВЕЦ МЕСЯЦА</div>
    <div style="font-size:26px;font-weight:800;color:#fbbf24;">${esc(best.sellerName) || '—'}</div>
    ${isAdmin
      ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;">Прибыль ${fmt(best.prof)} сум • бонус 5% = ${fmt((Number(best.prof) || 0) * SELLER_BONUS_PCT / 100)} сум</div>`
      : `<div style="font-size:12px;color:var(--muted);margin-top:4px;">${best.cnt} продаж • выручка ${fmt(best.rev)} сум</div>`}
  </div>`;

  html += '<div class="card"><div class="card-head"><span>📊 Рейтинг продавцов</span><span class="badge b-violet">' + (isAdmin ? 'бонус = 5% от прибыли' : 'по выручке за месяц') + '</span></div>';
  rows.forEach((r, i) => {
    const val = Number(r[key]) || 0;
    const bonus = (Number(r.prof) || 0) * SELLER_BONUS_PCT / 100;
    const w = Math.round(val / maxVal * 100);
    html += `<div class="row" style="display:block;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span class="nm">${medals[i] || (i + 1) + '.'} ${esc(r.sellerName) || '—'}</span>
        <span class="badge ${i === 0 ? 'b-amber' : 'b-violet'}">${fmt(val)} сум ${isAdmin ? 'прибыли' : 'выручки'}</span>
      </div>
      <div style="height:6px;border-radius:3px;background:rgba(255,255,255,0.06);margin-top:6px;">
        <div style="height:6px;border-radius:3px;width:${w}%;background:linear-gradient(90deg,#f59e0b,#8b5cf6);"></div>
      </div>
      <div class="meta">${r.cnt} продаж • ${Number(r.qty) || 0} шт${isAdmin ? ' • выручка ' + fmt(r.rev) + ' сум &nbsp;|&nbsp; 💰 Бонус 5%: <b style="color:#4ade80">' + fmt(bonus) + ' сум</b>' : ''}</div>
    </div>`;
  });
  html += '</div>';
  if (isAdmin) {
    // ----- Зарплатная ведомость за месяц (только админ) -----
    const lap = execToObjects(db,
      "SELECT COALESCE(SUM(s.quantity),0) qty FROM sales s LEFT JOIN products p ON p.id = s.productId " +
      "WHERE s.type = 'sale' AND p.category = 'laptop' AND s.date >= ? AND s.date < ?", [monthStart, monthEnd]);
    const lapQtyM = Number(lap[0] && lap[0].qty) || 0;
    const LAPTOP_FUND_PER_PC = 50000; // 50 000 сум с каждого проданного ноутбука (за штуку)
    const fundTotal = lapQtyM * LAPTOP_FUND_PER_PC;
    const fundHalf = Math.round(fundTotal / 2);

    const payouts = {}; // имя -> {bonus, fund}
    for (const r of rows) {
      const nm = (r.sellerName || '—').trim() || '—';
      payouts[nm] = { bonus: (Number(r.prof) || 0) * SELLER_BONUS_PCT / 100, fund: 0 };
    }
    if (fundTotal > 0) {
      for (const who of ['SHOXRUX', 'SANAT']) {
        let k = Object.keys(payouts).find(x => x.toUpperCase() === who);
        if (!k) { payouts[who] = { bonus: 0, fund: 0 }; k = who; }
        payouts[k].fund += fundHalf;
      }
    }
    const grandTotal = Object.values(payouts).reduce((a, v) => a + v.bonus + v.fund, 0);

    html += '<div class="card"><div class="card-head"><span>💼 Зарплатная ведомость — ' + esc(monthName) + '</span><span class="badge b-amber">только админ</span></div>';
    for (const [nm, v] of Object.entries(payouts).sort((a, b) => (b[1].bonus + b[1].fund) - (a[1].bonus + a[1].fund))) {
      const tot = v.bonus + v.fund;
      html += `<div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span class="nm">👤 ${esc(nm)}</span>
          <span class="badge b-green">${fmt(Math.round(tot))} сум</span>
        </div>
        <div class="meta">🏆 бонус 5% от прибыли: ${fmt(Math.round(v.bonus))} сум${v.fund > 0 ? ' &nbsp;|&nbsp; 💻 фонд ноутбуков: ' + fmt(v.fund) + ' сум' : ''}</div>
      </div>`;
    }
    html += `<div class="row" style="background:rgba(74,222,128,0.08);">
      <span class="nm" style="color:#4ade80;">💵 ИТОГО к выплате за месяц</span>
      <span class="badge b-green">${fmt(Math.round(grandTotal))} сум</span>
    </div>`;
    if (fundTotal > 0) {
      html += `<div class="meta" style="padding:4px 14px 12px;color:var(--muted);font-size:11px;">💻 Фонд ноутбуков за месяц: ${lapQtyM} шт × 50 000 = ${fmt(fundTotal)} сум (SHOXRUX ${fmt(fundHalf)} + SANAT ${fmt(fundHalf)})</div>`;
    }
    html += '</div>';
    html += '<div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:10px;">ℹ️ Бонус считается автоматически: 5% от прибыли, которую принёс продавец за выбранный месяц. Видно только админу.</div>';
  }
  document.getElementById('storeContent').innerHTML = html;
}
</script>
